<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinika TV</title>
  <meta name="description" content="Tinika TV — IPTV player for Apple TV, iPhone, iPad and Mac. Bring your own playlist.">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: #f5f7ff;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a4dff55, transparent 60%),
        radial-gradient(900px 500px at 90% 0%, #7a2cff44, transparent 55%),
        #050816;
      min-height: 100vh;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }
    .brand img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }
    h1 {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      line-height: 1.05;
      margin: 0 0 0.75rem;
      letter-spacing: -0.03em;
    }
    .lead {
      font-size: 1.2rem;
      color: #c9d2f0;
      max-width: 36rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 2rem 0 2.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.8rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
    a.primary {
      background: linear-gradient(135deg, #3b82ff, #7c3aed);
      color: white;
    }
    a.secondary {
      background: #ffffff14;
      color: #e8eeff;
      border: 1px solid #ffffff22;
    }
    .hero {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ffffff18;
      box-shadow: 0 20px 60px #00000066;
    }
    .hero img { width: 100%; display: block; }
    footer {
      margin-top: 2.5rem;
      color: #93a0c7;
      font-size: 0.95rem;
    }
    footer a { color: #9ec1ff; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="tinika-icon.png" alt="Tinika TV">
      <strong>Tinika TV</strong>
    </div>
    <h1>Live TV.<br>Beautifully organized.</h1>
    <p class="lead">
      Your playlists, channels and guide — on Apple TV, iPhone, iPad and Mac.
      Bring your own legally obtained playlist. No bundled channels.
    </p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/gennadii-TIME/Tinika-TV">Source on GitHub</a>
      <a class="btn secondary" href="privacy.html">Privacy Policy</a>
      <a class="btn secondary" href="mailto:support@tinika.lv">Support</a>
    </div>
    <div class="hero">
      <img src="screenshots/everywhere_tinika.png" alt="Tinika TV on Apple devices">
    </div>
    <footer>
      © 2026 Tinika Ltd · Based on <a href="https://github.com/bilipp/Lume">Lume</a> (AGPL-3.0)
    </footer>
  </main>
</body>
</html>
